<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="塔罗牌">
<meta name="theme-color" content="#000000">
<title>塔罗牌 · 维特普及版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#000000; --bg1:#000000; --bg2:#000000;
    --gold:#e8c882; --gold-hi:#ffd88a; --violet:#a98fe0;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(90% 70% at 72% 12%, rgba(38,28,86,.08) 0%, transparent 60%),
      radial-gradient(85% 65% at 22% 26%, rgba(14,32,68,.06) 0%, transparent 55%),
      radial-gradient(75% 60% at 50% 68%, rgba(44,18,54,.05) 0%, transparent 54%),
      radial-gradient(140% 100% at 50% 0%, #000000 0%, #000000 60%, #000000 100%);
    color:#eee; font-family:"Cinzel","Songti SC","STSong",serif;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }

  /* 银河层（2D canvas：极淡银河带） */
  #nebula{ position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* 星空层（2D canvas：闪烁星星 + 流星） */
  #stars{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* Three.js 渲染层 */
  #scene3d{ position:fixed; inset:0; z-index:5; pointer-events:none; }

  /* 顶部标题 */
  #hud{ position:fixed; top:16px; left:18px; right:auto; z-index:30; pointer-events:none; text-align:left; padding:0; }
  #hud h1{ font-size:15px; letter-spacing:3px; color:var(--gold-hi); text-shadow:0 0 16px rgba(255,216,138,.5); font-weight:900; }
  #hud .sub{ font-size:9px; letter-spacing:2px; color:#8f7fc0; margin-top:3px; }

  /* 底部状态 */
  #statusbar{ position:fixed; bottom:0; left:0; right:0; z-index:30; pointer-events:none; text-align:center; padding:0 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  #hints{ font-size:13px; letter-spacing:1px; color:#cdbdf0; }
  #hints b{ color:var(--gold-hi); }
  #status{ margin-top:8px; font-size:12px; color:#9f8cc7; min-height:16px; letter-spacing:1px; transition:color .2s; }
  #status.warn{ color:#ff9d9d; }
  #status.soft{ color:#e8c882; }

  #preview{ position:fixed; left:14px; bottom:14px; width:140px; border-radius:10px; border:1px solid rgba(232,200,130,.3);
    opacity:.13; z-index:40; transform:scaleX(-1); box-shadow:0 4px 14px rgba(0,0,0,.5); transition:opacity .3s; }
  #preview.show{ opacity:.85; }

  button.ctl{ position:fixed; z-index:45; font-family:inherit; letter-spacing:2px; cursor:pointer;
    border:1px solid rgba(232,200,130,.5); background:rgba(28,16,48,.8); color:var(--gold);
    padding:8px 14px; border-radius:8px; font-size:12px; transition:.2s; }
  button.ctl:hover{ background:rgba(70,42,110,.85); }
  #btnPreview{ right:14px; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); }
  #btnReset{ right:14px; bottom:calc(52px + env(safe-area-inset-bottom, 0px)); }
  #btnFull{ right:14px; bottom:calc(90px + env(safe-area-inset-bottom, 0px)); }

  #reading{ position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(105%);
    width:min(560px, 94vw); max-height:62vh; overflow-y:auto; z-index:44;
    background:linear-gradient(180deg, rgba(22,13,44,.97), rgba(6,4,16,.99));
    border:1px solid rgba(232,200,130,.35); border-bottom:none;
    border-radius:20px 20px 0 0; padding:22px 24px 30px; color:#e9dcf0;
    box-shadow:0 -12px 44px rgba(0,0,0,.65), 0 0 42px rgba(120,80,200,.16);
    transition:transform .55s cubic-bezier(.2,.7,.2,1); pointer-events:auto;
    font-family:"Songti SC","STSong",serif; }
  #reading.show{ transform:translateX(-50%) translateY(0); }
  #reading .r-head{ text-align:center; font-size:18px; letter-spacing:5px; color:var(--gold-hi);
    margin-bottom:14px; text-shadow:0 0 18px rgba(255,216,138,.5); }
  #reading .r-card{ border-top:1px solid rgba(232,200,130,.16); padding:12px 2px 10px; }
  #reading .r-pos{ font-size:11px; letter-spacing:3px; color:#b9a6e0; }
  #reading .r-name{ font-size:20px; color:#f6d190; margin:3px 0 6px; font-weight:700; }
  #reading .r-name span{ font-size:13px; color:#a08cc9; font-weight:400; margin-left:8px; letter-spacing:1px; }
  #reading .r-meaning{ font-size:14px; line-height:1.65; color:#e7dcf0; }
  #reading .r-orient{ display:inline-block; font-size:10px; letter-spacing:1px; padding:1px 7px; border-radius:20px;
    margin-left:8px; color:#9fe6b8; border:1px solid rgba(120,220,160,.4); background:rgba(40,120,80,.14); }
  #reading .r-orient.rev{ color:#f0a8a8; border-color:rgba(230,130,130,.45); background:rgba(150,50,60,.16); }
  #reading .r-summary{ margin-top:16px; padding:13px 14px; border:1px solid rgba(232,200,130,.25);
    border-radius:12px; font-size:13px; line-height:1.75; color:#dccbe8; background:rgba(120,80,200,.08); }
  #reading .r-close{ display:block; margin:18px auto 0; font-family:inherit; letter-spacing:4px; cursor:pointer;
    border:1px solid rgba(232,200,130,.5); background:rgba(28,16,48,.8); color:var(--gold);
    padding:9px 22px; border-radius:8px; font-size:13px; transition:.2s; }
  #reading .r-close:hover{ background:rgba(70,42,110,.85); }

  /* 问题输入框（开启占卜前） */
  #question{ width:100%; max-width:460px; margin-top:22px; padding:12px 14px; border-radius:10px;
    border:1px solid rgba(232,200,130,.4); background:rgba(18,11,38,.72); color:#f0e7f8;
    font-family:"Songti SC","STSong",serif; font-size:14px; line-height:1.5; resize:none; height:76px; }
  #question::placeholder{ color:#7d6ca8; }
  #question:focus{ outline:none; border-color:var(--gold-hi); box-shadow:0 0 12px rgba(232,200,130,.32); }

  /* 解读面板：问题回显 */
  #reading .r-q{ text-align:center; font-size:13px; letter-spacing:1px; color:#b9a6e0; margin-bottom:6px; }

  /* 解读来源标签（AI / 本地） */
  #reading .r-tag{ display:inline-block; font-size:10px; letter-spacing:2px; padding:2px 9px; border-radius:20px;
    margin-bottom:8px; color:#b9a6e0; border:1px solid rgba(232,200,130,.3); background:rgba(120,80,200,.10); }
  #reading .r-tag.ai{ color:#ffd88a; border-color:rgba(255,216,138,.5); }

  #debug{ position:fixed; left:14px; top:14px; z-index:60; font-size:11px; line-height:1.7;
    color:#a08cc9; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; pointer-events:none; white-space:pre; display:none; }

  /* 授权引导覆盖层 */
  #overlay{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 20%, rgba(45,27,78,.92), rgba(2,3,10,.98)); }
  #overlay .box{ text-align:center; max-width:620px; padding:34px 40px; }
  #overlay h2{ font-size:26px; letter-spacing:4px; color:var(--gold-hi); text-shadow:0 0 20px rgba(255,216,138,.5); }
  #overlay p{ margin-top:16px; font-size:14px; line-height:1.9; color:#cfc2ea; }
  #overlay .gest{ margin-top:20px; text-align:left; display:inline-block; font-size:13px; line-height:2.1; color:#cdbdf0; }
  #overlay .gest b{ color:var(--gold-hi); }
  #startBtn{ margin-top:28px; font-family:inherit; font-size:15px; letter-spacing:4px; cursor:pointer;
    padding:12px 34px; border-radius:30px; border:1px solid var(--gold-hi); color:#1a0d2e;
    background:linear-gradient(180deg,#ffe1a0,#e8c882); box-shadow:0 0 30px rgba(232,200,130,.5); transition:.2s; }
  #startBtn:hover{ transform:translateY(-1px); box-shadow:0 0 44px rgba(232,200,130,.7); }
  #err{ margin-top:18px; color:#ff9d9d; font-size:13px; min-height:18px; }

  /* 加载动画 */
  #loading{ position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 30%, rgba(45,27,78,.9), rgba(2,3,10,.97)); }
  #loading.show{ display:flex; }
  #loading .inner{ text-align:center; }
  .spinner{ width:50px; height:50px; margin:0 auto 18px; border:3px solid rgba(232,200,130,.18);
    border-top-color:var(--gold-hi); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading .txt{ font-size:13px; letter-spacing:3px; color:#cdbdf0; }

<style>

/* ============ 全息卡（隐藏卡）样式 ============ */

*{box-sizing:border-box}.card{width:min(70vw,420px)}[hidden]{display:none!important}
.card{--rotate-x:0deg;--rotate-y:0deg;--card-scale:1;--subject-x:0%;--subject-y:0%;--subject-z:0px;--flip-y:0deg;--tilt-duration:0ms;position:relative;width:min(70vw,420px);aspect-ratio:5/7;perspective:1100px;outline:none;touch-action:none;isolation:isolate}
.pending{visibility:hidden}
.rotator{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rotate-x)) rotateY(calc(var(--rotate-y) + var(--flip-y))) scale(var(--card-scale));transition:transform var(--tilt-duration) var(--tilt-ease,linear);will-change:transform}
.front,.back{position:absolute;inset:0;box-sizing:border-box;border-radius:var(--outer-radius);background:transparent;box-shadow:none;backface-visibility:hidden;transform-style:preserve-3d}
.front{transform:rotateY(0deg)}.back{transform:rotateY(180deg)}
.surface{position:absolute;inset:0;border-radius:inherit;background:transparent;transform-style:preserve-3d}
.background,.materialCanvas,.subjectShadow,.subject{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:inherit;user-select:none;pointer-events:none}
.background{z-index:0;object-fit:cover;opacity:0}.materialCanvas{z-index:1}.back .background{opacity:1}
.subjectShadow{z-index:2;object-fit:cover;opacity:var(--shadow-opacity);backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;transform:translate3d(calc(var(--subject-x) + .45%),calc(var(--subject-y) + .65%),calc(var(--subject-z) - 4px));transition:transform var(--tilt-duration) var(--tilt-ease,linear);will-change:transform}
.subject{z-index:3;object-fit:cover;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;transform:translate3d(var(--subject-x),var(--subject-y),calc(var(--subject-z) + .01px));transition:transform var(--tilt-duration) var(--tilt-ease,linear);will-change:transform}
.frame-none{--frame-width:0%}

.renderError{width:min(70vw,420px);aspect-ratio:5/7;display:grid;place-items:center;padding:2rem;border:1px solid #7f8a99;border-radius:1.4rem;background:#070a0f;color:#eef3f7;font:500 14px/1.5 system-ui,sans-serif;text-align:center}
@media (prefers-reduced-motion:reduce){.rotator,.subject,.subjectShadow{transition:none!important}.rotator{transform:none!important}.subject,.subjectShadow{transform:none!important}}


#viewer .holo-holder .card{width:min(86vw,470px)}
/* ============ 卡牌放大观看 ============ */
#viewer{ position:fixed; inset:0; z-index:120; display:none; }
#viewer.show{ display:flex; align-items:center; justify-content:center; }
#viewer .v-backdrop{ position:absolute; inset:0; background:rgba(2,3,10,.84); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
#viewer .v-body{ position:relative; z-index:1; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:14px; }
#viewer .v-close{ position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:16px; z-index:2; width:44px; height:44px; border-radius:50%; border:1px solid rgba(232,200,130,.5); background:rgba(28,16,48,.85); color:var(--gold); font-size:18px; cursor:pointer; }
#viewer .v-stage{ position:relative; display:flex; align-items:center; justify-content:center; width:100%; flex:1 1 auto; min-height:0; }
#viewer .holo-holder{ width:min(86vw,470px); }
#viewer .v-cardimg{ max-width:min(82vw,400px); max-height:60vh; border-radius:16px; box-shadow:0 12px 44px rgba(0,0,0,.7), 0 0 34px rgba(120,80,200,.25); border:1px solid rgba(232,200,130,.3); object-fit:contain; }
#viewer .v-info{ text-align:center; width:min(560px,92vw); }
#viewer .v-name{ font-size:22px; color:#f6d190; letter-spacing:2px; font-weight:700; }
#viewer .v-name span{ font-size:14px; color:#a08cc9; margin-left:10px; letter-spacing:1px; font-weight:400; }
#viewer .v-meaning{ margin-top:8px; font-size:14px; line-height:1.7; color:#e7dcf0; }
#viewer .v-tip{ margin-top:8px; font-size:12px; color:#b9a6e0; letter-spacing:1px; }
#viewer .v-fallback{ font-size:72px; color:#ffd88a; }
#reading .r-card{ cursor:pointer; border-radius:10px; padding:12px 10px; transition:background .2s; }
#reading .r-card:hover{ background:rgba(120,80,200,.12); }
#reading .r-open{ margin-top:8px; font-size:11px; letter-spacing:1px; color:#8f7fc0; opacity:.7; transition:.2s; }
#reading .r-card:hover .r-open{ opacity:1; color:var(--gold-hi); }
#reading .r-orient.holo{ color:#ffd88a; border-color:rgba(255,216,138,.5); background:rgba(150,110,40,.15); }


/* ============ 动态展示：3D 倾斜 + 移动高光 ============ */
#viewer .tilt3d{ position:relative; perspective:1200px; touch-action:none; }
#viewer .tilt3d .v-cardimg{ transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:none; will-change:transform; -webkit-user-drag:none; user-select:none; }
#viewer .tilt3d .v-glare{ position:absolute; inset:0; border-radius:16px; pointer-events:none; mix-blend-mode:screen;
  background:linear-gradient(115deg, rgba(255,255,255,0) 32%, rgba(255,255,255,.34) 46%, rgba(255,255,255,.10) 54%, rgba(255,255,255,0) 68%);
  background-size:240% 240%; background-position:var(--gp,50% 50%); }

/* ============ 历史记录 ============ */
#btnHistory{ right:14px; bottom:calc(128px + env(safe-area-inset-bottom, 0px)); }
#history{ position:fixed; inset:0; z-index:130; display:none; }
#history.show{ display:block; }
#history .h-backdrop{ position:absolute; inset:0; background:rgba(2,3,10,.7); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
#history .h-panel{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(560px,94vw); max-height:82vh; overflow-y:auto; border-radius:18px;
  background:linear-gradient(180deg, rgba(24,15,46,.98), rgba(6,4,16,.99));
  border:1px solid rgba(232,200,130,.35); padding:20px 22px; color:#e9dcf0;
  box-shadow:0 16px 60px rgba(0,0,0,.7), 0 0 42px rgba(120,80,200,.2); }
#history .h-head{ display:flex; align-items:center; justify-content:space-between; font-size:17px; letter-spacing:4px; color:var(--gold-hi); margin-bottom:14px; }
#history .h-close{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(232,200,130,.5); background:rgba(28,16,48,.85); color:var(--gold); cursor:pointer; font-size:15px; }
#history .h-item{ border-top:1px solid rgba(232,200,130,.16); padding:14px 2px; }
#history .h-item:first-of-type{ border-top:none; }
#history .h-time{ font-size:11px; letter-spacing:2px; color:#8f7fc0; }
#history .h-q{ font-size:13px; color:#b9a6e0; margin:4px 0 8px; }
#history .h-cards{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
#history .h-chip{ font-size:12px; letter-spacing:1px; padding:2px 9px; border-radius:20px; border:1px solid rgba(232,200,130,.4); color:#f6d190; background:transparent; cursor:pointer; font-family:inherit; }
#history .h-chip.rev{ color:#f0a8a8; border-color:rgba(230,130,130,.45); background:rgba(150,50,60,.14); }
#history .h-chip.holo{ color:#ffd88a; border-color:rgba(255,216,138,.5); background:rgba(150,110,40,.15); }
#history .h-summary{ font-size:13px; line-height:1.7; color:#e7dcf0; margin-top:8px; }
#history .h-empty{ text-align:center; color:#8f7fc0; padding:26px 0; font-size:13px; letter-spacing:2px; }
</style>
</head>
<body>

<canvas id="nebula"></canvas>
<canvas id="stars"></canvas>
<div id="scene3d"></div>

<div id="hud">
  <h1>塔 罗 牌</h1>
  <div class="sub">RIDER-WAITE · 维特普及版 · 78 张</div>
</div>

<div id="statusbar">
  <div id="hints">🖐 <b>张开手掌</b> 洗牌 ｜ ✊ <b>握拳</b> 选牌 ｜ ✨ 三张选完自动开牌</div>
  <div id="status">点击“开启占卜”授权摄像头</div>
</div>

<div id="reading"></div>
<div id="viewer">
  <div class="v-backdrop"></div>
  <div class="v-body">
    <button class="v-close" id="vClose">✕</button>
    <div class="v-stage" id="vStage"></div>
    <div class="v-info" id="vInfo"></div>
  </div>
</div>
<div id="history">
  <div class="h-backdrop"></div>
  <div class="h-panel">
    <div class="h-head">🕰 历史占卜 <button class="h-close" id="hClose">✕</button></div>
    <div class="h-list" id="hList"></div>
  </div>
</div>


<video id="preview" autoplay playsinline muted></video>
<button class="ctl" id="btnPreview">📷 预览</button>
<button class="ctl" id="btnReset">🔄 重新开始</button>
<button class="ctl" id="btnFull">⛶ 全屏</button>
<button class="ctl" id="btnHistory">🕰 历史</button>
<div id="debug"></div>

<div id="overlay">
  <div class="box">
    <h2>开启你的牌阵</h2>
    <p>摄像头画面<b>仅在本地处理</b>，用于识别手部关键点，<br>不会上传、不会存储任何影像数据。</p>
    <div class="gest">
      🖐 <b>张开手掌，左右挥动</b> —— 洗牌，翻动牌阵<br>
      ✊ <b>握拳</b> —— 选牌，选中当前中间那张<br>
      🗂 选中的牌会<b>化作星尘</b>飞入顶部三个格子<br>
      ✨ 三张选完，自动<b>开牌</b>
    </div>
    <textarea id="question" placeholder="（可选）写下你想问的问题…" maxlength="200"></textarea>
    <button id="startBtn">开启占卜</button>
    <div id="err"></div>
  </div>
</div>

<div id="loading">
  <div class="inner">
    <div class="spinner"></div>
    <div class="txt">正在加载 78 张卡牌…</div>
  </div>
</div>

class HolographicRendererError extends Error {
  constructor(code, message) {
    super(message);
    this.name = "HolographicRendererError";
    this.code = code;
  }
}

function clampDevicePixelRatio(value, { mobile = false } = {}) {
  const limit = mobile ? MOBILE_MAX_DEVICE_PIXEL_RATIO : MAX_DEVICE_PIXEL_RATIO;
  return Math.min(limit, Math.max(1, Number.isFinite(Number(value)) ? Number(value) : 1));
}

function buildFragmentShader(family) {
  if (!MATERIAL_SET.has(family)) throw new HolographicRendererError("unknown-material", `Unknown material: ${family}`);
  return `${FRAGMENT_HEADER}${MATERIAL_BODIES[family]}${FRAGMENT_MAIN}`;
}

function clampIntensity(value) {
  return Math.max(0, Math.min(1, Number(value) || 0));
}

function hexColor(value, fallback) {
  const match = /^#([0-9a-f]{6})$/i.exec(typeof value === "string" ? value : fallback);
  const raw = match ? match[1] : fallback.slice(1);
  return [0, 2, 4].map(offset => parseInt(raw.slice(offset, offset + 2), 16) / 255);
}

function compileShader(gl, type, source) {
  const shader = gl.createShader(type);
  if (!shader) throw new HolographicRendererError("shader-create", "Unable to create a WebGL2 shader.");
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const detail = gl.getShaderInfoLog(shader) || "unknown compiler error";
    gl.deleteShader(shader);
    throw new HolographicRendererError("shader-compile", `WebGL2 shader compilation failed: ${detail}`);
  }
  return shader;
}

function createProgram(gl, family) {
  const vertex = compileShader(gl, gl.VERTEX_SHADER, VERTEX_SHADER);
  const fragment = compileShader(gl, gl.FRAGMENT_SHADER, buildFragmentShader(family));
  const program = gl.createProgram();
  if (!program) throw new HolographicRendererError("program-create", "Unable to create a WebGL2 program.");
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const detail = gl.getProgramInfoLog(program) || "unknown linker error";
    gl.deleteProgram(program);
    throw new HolographicRendererError("program-link", `WebGL2 program linking failed: ${detail}`);
  }
  return program;
}

function backgroundIntensity(presentation, kind) {
  const value = presentation?.[kind] || {};
  let target = value.target;
  if (target === "surface" && kind === "foil" && presentation?.surface?.material !== "clear-coat") target = "background";
  if (target === "surface" && (kind === "texture" || kind === "sparkle")) target = "background";
  if (target !== "background") return 0;
  if ((kind === "foil" || kind === "sparkle" || kind === "glare") && !value.enabled) return 0;
  return perceptualIntensity(clampIntensity(value.intensity), kind);
}

async function loadTextureImage(url, label, signal) {
  let response;
  try {
    response = await fetch(url, { cache: "force-cache", signal });
  } catch (error) {
    throw new HolographicRendererError("material-texture-load", `Unable to load ${label}: ${error}`);
  }
  if (!response.ok) throw new HolographicRendererError("material-texture-load", `Unable to load ${label}: HTTP ${response.status}.`);
  let blob;
  try {
    blob = await response.blob();
  } catch (error) {
    throw new HolographicRendererError("material-texture-load", `Unable to read ${label}: ${error}`);
  }
  try {
    if (typeof createImageBitmap === "function") {
      const bitmap = await createImageBitmap(blob);
      if (!bitmap.width || !bitmap.height) throw new Error("decoded bitmap has no dimensions");
      return bitmap;
    }
    if (typeof Image !== "function") throw new Error("image decoding is unavailable");
    const image = new Image();
    image.decoding = "async";
    image.src = url;
    if (typeof image.decode === "function") await image.decode();
    else await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error("image decode failed")); });
    if (!image.naturalWidth || !image.naturalHeight) throw new Error("decoded image has no dimensions");
    return image;
  } catch (error) {
    throw new HolographicRendererError("material-texture-decode", `Unable to decode ${label}: ${error}`);
  }
}

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
function buildNormalDeck(){
  const d = [];
  for (const m of MAJOR) d.push({ file:m[0], zh:m[1], en:m[2], meaning:m[3] });
  for (const s of SUIT_DEFS){
    for (let i=0;i<14;i++){
      const rank = RANKS[i];
      d.push({
        file: `${s.key}_${String(i+1).padStart(2,'0')}`,
        zh: `${s.zh}${rank[2]}`,
        en: `${rank[1]} of ${s.en}`,
        meaning: MINOR_MEANINGS[s.key][i]
      });
    }
  }
  return d;
}
let deck = [];                 // 当前牌堆（长度 78 或 79）
let holoIndex = -1;            // 隐藏卡在 deck 中的下标，未入局为 -1
function buildDeck(){
  const d = buildNormalDeck();
  shuffle(d);                  // 78 张正常牌洗牌
  holoIndex = -1;
  if (HOLO_ENABLED && (HOLO_FORCE || Math.random() < HOLO_CHANCE)){

  }
  deck = d;
  MAX_INDEX = deck.length - 1;
  CENTER_INDEX = (deck.length - 1) / 2;
}

/* ============ 银河背景（极淡银河带） ============ */
const nebulaCanvas = document.getElementById('nebula');
const nctx = nebulaCanvas.getContext('2d');
function drawNebula(){
  const w = nebulaCanvas.width  = window.innerWidth;
  const h = nebulaCanvas.height = window.innerHeight;
  nctx.clearRect(0,0,w,h);
  nctx.globalCompositeOperation = 'lighter';

  const cx = w*0.5, cy = h*0.45;      // 银河中心（略偏上）
  const ang = -0.42;                   // 倾角
  const len = Math.hypot(w,h)*0.9;     // 整条带的长度
  const cos = Math.cos(ang), sin = Math.sin(ang);

  // 极淡的核球
  const core = nctx.createRadialGradient(cx,cy,0, cx,cy, len*0.12);
  core.addColorStop(0, 'rgba(226,216,236,0.10)');
  core.addColorStop(1, 'rgba(226,216,236,0)');
  nctx.fillStyle = core;
  nctx.beginPath(); nctx.arc(cx,cy,len*0.12,0,Math.PI*2); nctx.fill();

  // 沿倾斜轴撒淡星点，中心略密、两端渐隐
  const N = 240;
  const cols = ['190,200,235','212,204,230','236,222,214'];
  for (let i=0;i<N;i++){
    const t = Math.random()*2 - 1;                 // -1..1 沿轴
    const along = t * len*0.5;
    const spread = (Math.random()*2-1) * len*(0.015 + 0.045*Math.abs(t));
    const x = cx + along*cos - spread*sin;
    const y = cy + along*sin + spread*cos;
    const dens = Math.max(0, 1 - Math.abs(t));
    const r = 1 + Math.random()*2.2;
    const a = (0.03 + 0.09*Math.random()) * dens;
    const col = cols[(Math.random()*cols.length)|0];
    const g = nctx.createRadialGradient(x,y,0, x,y,r*3);
    g.addColorStop(0, `rgba(${col},${a})`);
    g.addColorStop(1, `rgba(${col},0)`);
    nctx.fillStyle = g;
    nctx.beginPath(); nctx.arc(x,y,r*3,0,Math.PI*2); nctx.fill();
  }

  nctx.globalCompositeOperation = 'source-over';
}
drawNebula();

/* ============ 星空背景 ============ */
const starCanvas = document.getElementById('stars');
const sctx = starCanvas.getContext('2d');
let stars = [], meteors = [];
function initStars(){
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  const n = Math.floor(starCanvas.width * starCanvas.height / 4000);
  stars = [];
  for (let i=0;i<n;i++){
    const t = Math.random();
    let r, base, sp, color, tier;
    if (t < 0.06){                 // 主星：大而亮，带十字星芒
      tier = 2; r = 1.3 + Math.random()*1.2; base = 0.85 + Math.random()*0.15;
      sp = 0.9 + Math.random()*1.1;
      color = Math.random() < 0.5 ? '255,255,255' : '255,244,220';
    } else if (t < 0.38){          // 亮星
      tier = 1; r = 0.7 + Math.random()*0.85; base = 0.65 + Math.random()*0.35;
      sp = 1.5 + Math.random()*2.5;
      color = Math.random() < 0.7 ? '224,236,255' : '224,232,255';
    } else {                        // 背景星
      tier = 0; r = 0.25 + Math.random()*0.55; base = 0.42 + Math.random()*0.35;
      sp = 1.5 + Math.random()*2.5;
      color = Math.random() < 0.5 ? '176,196,235' : '168,176,222';
    }
    stars.push({
      x: Math.random()*starCanvas.width,
      y: Math.random()*starCanvas.height,
      r, base, sp,
      ph: Math.random()*Math.PI*2,
      color, tier
    });
  }
}
function drawStars(now){
  const t = now*0.001;
  sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
  sctx.globalCompositeOperation = 'lighter';   // 叠加发光，更亮更通透
  for (const s of stars){
    const wave = Math.sin(t*s.sp + s.ph);
    const tw = 0.5 + 0.5*wave;                       // 0..1
    const a = Math.max(0, Math.min(1, s.base*(0.12 + 0.88*tw*tw)));   // 锐利闪烁：低基线、高峰值
    const rCore = s.r*(0.7 + 0.6*tw);
    const rGlow = s.r*(3.5 + 1.6*tw);

    // 柔和光晕
    const gr = sctx.createRadialGradient(s.x,s.y,0, s.x,s.y, rGlow);
    gr.addColorStop(0, `rgba(${s.color},${a})`);
    gr.addColorStop(0.35, `rgba(${s.color},${a*0.28})`);
    gr.addColorStop(1, `rgba(${s.color},0)`);
    sctx.fillStyle = gr;
    sctx.beginPath(); sctx.arc(s.x,s.y,rGlow,0,Math.PI*2); sctx.fill();

    // 亮核
    sctx.fillStyle = `rgba(${s.color},${Math.min(1, a*1.2)})`;
    sctx.beginPath(); sctx.arc(s.x, s.y, rCore, 0, Math.PI*2); sctx.fill();

    // 亮星加十字星芒（衍射光线），随闪烁明暗伸缩
    if (s.tier >= 1){
      const flare = tw * 0.9;
      if (flare > 0.03){
        const len = rGlow*(1.2 + 0.9*tw);
        sctx.strokeStyle = `rgba(${s.color},${flare})`;
        sctx.lineCap = 'round';
        sctx.lineWidth = Math.max(0.6, s.r*0.32);
        sctx.beginPath();
        sctx.moveTo(s.x - len, s.y); sctx.lineTo(s.x + len, s.y);
        sctx.moveTo(s.x, s.y - len); sctx.lineTo(s.x, s.y + len);
        sctx.stroke();
        const len2 = rGlow*0.5;
        sctx.lineWidth = Math.max(0.4, s.r*0.2);
        sctx.beginPath();
        sctx.moveTo(s.x - len2, s.y - len2); sctx.lineTo(s.x + len2, s.y + len2);
        sctx.moveTo(s.x - len2, s.y + len2); sctx.lineTo(s.x + len2, s.y - len2);
        sctx.stroke();
      }
    }
  }
  // 流星（缓慢划过、微光拖尾）
  if (Math.random() < 0.004 && meteors.length < 3){
    const fromLeft = Math.random() < 0.5;
    meteors.push({
      x: fromLeft ? Math.random()*starCanvas.width*0.5 : starCanvas.width*0.5 + Math.random()*starCanvas.width*0.5,
      y: Math.random()*starCanvas.height*0.35,
      vx: (fromLeft?1:-1)*(3+Math.random()*3),
      vy: 1.5+Math.random()*1.5,
      life: 1
    });
  }
  for (let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    m.x += m.vx; m.y += m.vy; m.life -= 0.012;
    if (m.life<=0 || m.x<-40 || m.x>starCanvas.width+40 || m.y>starCanvas.height+40){ meteors.splice(i,1); continue; }
    const len = 46;
    const grad = sctx.createLinearGradient(m.x,m.y,m.x-m.vx*len,m.y-m.vy*len);
    grad.addColorStop(0, `rgba(210,222,255,${0.5*m.life})`);
    grad.addColorStop(1, 'rgba(210,222,255,0)');
    sctx.strokeStyle = grad; sctx.lineWidth = 1.1; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(m.x,m.y); sctx.lineTo(m.x-m.vx*len, m.y-m.vy*len); sctx.stroke();
  }
  sctx.globalCompositeOperation = 'source-over';
}
initStars();

/* 自适应横竖屏：按可见范围缩放相机距离，让牌阵与顶部格子始终容纳在屏幕内 */
const CAM_DIST = 6;                 // 基准相机距离
const FIT_W = 1.7, FIT_H = 2.5;     // 需容纳的世界空间半宽 / 半高（含格子与中心牌）
function fitScene(){
  const aspect = window.innerWidth / window.innerHeight;
  const tanH = 0.4142;              // tan(45°/2)
  const halfH = tanH * CAM_DIST;    // 基准距离下的可见半高
  const halfW = halfH * aspect;
  const s = Math.min(1, halfW/FIT_W, halfH/FIT_H);
  camera.position.z = CAM_DIST / s;
}
fitScene();

/* —— 牌背纹理（程序化，维特风格） —— */
let backCanvas = null, backData = null;
function makeBackTexture(){
  const W=512, H=870, cx=256, cy=435;
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const g = c.getContext('2d');
  g.lineJoin='round'; g.lineCap='round';

  const GOLD='#c9a25f', GOLD_HI='#ecd494', GOLD_DIM='#8a6d35';
  const WINE='#5e2230', WINE_HI='#8a3a48';
  const M=24, FW=W-M*2, FH=H-M*2;   // 卡面铺满整牌（464×822）

  // —— 辅助绘制 ——
  function rr(x,y,w,h,r){
    g.beginPath();
    g.moveTo(x+r,y);
    g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r);
    g.arcTo(x,y,x+w,y,r);
    g.closePath();
  }
  function star(x,y,out,inn,p,rot){
    g.save(); g.translate(x,y); g.rotate(rot||0);
    g.beginPath();
    for(let k=0;k<p*2;k++){
      const r=k%2?inn:out, a=k*Math.PI/p-Math.PI/2;
      const px=Math.cos(a)*r, py=Math.sin(a)*r;
      k?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.closePath(); g.fill(); g.restore();
  }
  function crescent(x,y,r,rot){
    g.save(); g.translate(x,y); g.rotate(rot||0);
    g.beginPath();
    g.arc(0,0,r, Math.PI*0.5, Math.PI*1.5);
    g.arc(r*0.36,0,r*0.7, Math.PI*1.5, Math.PI*0.5, true);
    g.closePath(); g.fill(); g.restore();
  }
  function diamond(x,y,r){
    g.beginPath(); g.moveTo(x,y-r); g.lineTo(x+r,y); g.lineTo(x,y+r); g.lineTo(x-r,y); g.closePath();
  }

  // —— 1) 深藏蓝底（铺满整牌，不透明） ——
  let bg = g.createRadialGradient(cx,cy,40, cx,cy, H*0.72);
  bg.addColorStop(0,'#0e1f42'); bg.addColorStop(.5,'#0a1a3a'); bg.addColorStop(1,'#050a1c');
  g.fillStyle=bg; g.fillRect(0,0,W,H);

  // —— 2) 卡面（墨紫→藏蓝斜向渐变） ——
  rr(M,M,FW,FH,24);
  let face = g.createLinearGradient(0,0,W,H);
  face.addColorStop(0,'#0c1d40'); face.addColorStop(.45,'#091430'); face.addColorStop(.55,'#150f2e'); face.addColorStop(1,'#0d1838');
  g.fillStyle=face; g.fill();

  // —— 3) 内部纹样（裁剪到卡面内） ——
  g.save();
  rr(M,M,FW,FH,24); g.clip();

  // 内框（双线）
  rr(M+28,M+28,FW-56,FH-56,14);
  g.strokeStyle='rgba(201,162,95,.5)'; g.lineWidth=1.2; g.stroke();
  rr(M+36,M+36,FW-72,FH-72,11);
  g.strokeStyle='rgba(138,109,53,.38)'; g.lineWidth=0.8; g.stroke();

  // 内框点阵（暗金/酒红菱形交替，四边）
  const dotStart=M+48, dotEnd=W-dotStart, step=23;
  for(let x=dotStart; x<=dotEnd; x+=step){
    const gold=((x-dotStart)/step)%2<1;
    g.fillStyle=gold?'rgba(201,162,95,.7)':'rgba(138,58,72,.65)';
    g.save(); g.translate(x,dotStart); g.rotate(Math.PI/4); g.fillRect(-2.2,-2.2,4.4,4.4); g.restore();
    g.save(); g.translate(x,H-dotStart); g.rotate(Math.PI/4); g.fillRect(-2.2,-2.2,4.4,4.4); g.restore();
  }
  for(let y=dotStart+step; y<=H-dotStart-step; y+=step){
    const gold=((y-dotStart)/step)%2<1;
    g.fillStyle=gold?'rgba(201,162,95,.7)':'rgba(138,58,72,.65)';
    g.save(); g.translate(dotStart,y); g.rotate(Math.PI/4); g.fillRect(-2.2,-2.2,4.4,4.4); g.restore();
    g.save(); g.translate(W-dotStart,y); g.rotate(Math.PI/4); g.fillRect(-2.2,-2.2,4.4,4.4); g.restore();
  }

  // 四角星月符文（弯月朝中心 + 四芒星）
  const dirs=[[-1,-1],[1,-1],[-1,1],[1,1]];
  for(const [sx,sy] of dirs){
    const px=cx+sx*150, py=cy+sy*150;
    const ang=Math.atan2(cy-py, cx-px);
    g.fillStyle='rgba(201,162,95,.8)';
    crescent(px,py, 16, ang);
    g.fillStyle='rgba(236,212,148,.85)';
    star(px+sx*26, py+sy*26, 6.5, 2.6, 4, Math.PI/4);
  }

  // —— 4) 中心神圣几何 ——
  g.save(); g.translate(cx,cy);

  // 菱形外框（旋转45°正方形）
  g.rotate(Math.PI/4);
  g.fillStyle='rgba(29,18,48,.4)';
  diamond(0,0,150); g.fill();
  g.strokeStyle='rgba(201,162,95,.55)'; g.lineWidth=1.6; diamond(0,0,150); g.stroke();
  g.strokeStyle='rgba(138,109,53,.32)'; g.lineWidth=0.8; diamond(0,0,138); g.stroke();
  g.rotate(-Math.PI/4);

  // 同心圆环
  g.strokeStyle='rgba(201,162,95,.7)'; g.lineWidth=2; g.beginPath(); g.arc(0,0,112,0,Math.PI*2); g.stroke();
  g.strokeStyle='rgba(236,212,148,.45)'; g.lineWidth=1; g.beginPath(); g.arc(0,0,104,0,Math.PI*2); g.stroke();

  // 放射线
  g.strokeStyle='rgba(201,162,95,.2)'; g.lineWidth=1;
  for(let k=0;k<48;k++){
    const a=k*Math.PI/24;
    g.beginPath(); g.moveTo(Math.cos(a)*78,Math.sin(a)*78); g.lineTo(Math.cos(a)*98,Math.sin(a)*98); g.stroke();
  }
  // 环上星月小符文（交替星/月）
  for(let k=0;k<12;k++){
    const a=k*Math.PI/6 - Math.PI/2;
    const x=Math.cos(a)*90, y=Math.sin(a)*90;
    if(k%2){ g.fillStyle='rgba(236,212,148,.75)'; star(x,y,4.6,1.8,4,a); }
    else { g.fillStyle='rgba(201,162,95,.7)'; crescent(x,y,5,a); }
  }

  // 六芒星（大卫星）
  g.fillStyle='rgba(29,18,48,.55)';
  star(0,0,62,31,6,0);
  g.strokeStyle='rgba(201,162,95,.8)'; g.lineWidth=1.3;
  g.beginPath();
  for(let k=0;k<12;k++){
    const r=k%2?31:62, a=k*Math.PI/6-Math.PI/2;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    k?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.closePath(); g.stroke();

  // 内圆 + 中央宝石
  g.fillStyle='rgba(5,13,34,.9)';
  g.beginPath(); g.arc(0,0,34,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(201,162,95,.55)'; g.lineWidth=1; g.beginPath(); g.arc(0,0,34,0,Math.PI*2); g.stroke();

  const gemGrad = g.createLinearGradient(0,-20,0,20);
  gemGrad.addColorStop(0,WINE_HI); gemGrad.addColorStop(.5,WINE); gemGrad.addColorStop(1,'#3a1018');
  g.fillStyle=gemGrad;
  diamond(0,0,20); g.fill();
  g.strokeStyle='rgba(236,212,148,.85)'; g.lineWidth=1.3; diamond(0,0,20); g.stroke();
  g.fillStyle='rgba(255,240,210,.55)';
  g.beginPath(); g.moveTo(-11,-9); g.lineTo(-4,-12); g.lineTo(-6,-5); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.8)';
  g.beginPath(); g.arc(-5,-5,2,0,Math.PI*2); g.fill();

  g.restore();   // 中心

  // —— 5) 做旧（噪点 + 暗角，整牌） ——
  for(let i=0;i<380;i++){
    const dark=Math.random()<0.6;
    g.fillStyle= dark?`rgba(0,0,0,${0.02+Math.random()*0.05})`:`rgba(201,162,95,${0.02+Math.random()*0.04})`;
    g.beginPath(); g.arc(Math.random()*W, Math.random()*H, Math.random()*1.3+0.3, 0, Math.PI*2); g.fill();
  }
  let vig = g.createRadialGradient(cx,cy,H*0.14, cx,cy,H*0.74);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.42)');
  g.fillStyle=vig; g.fillRect(0,0,W,H);

  g.restore();   // 取消 clip

  // —— 6) 卡面边缘：金属描边 + 微弱发光 ——
  g.save();
  g.shadowColor='rgba(201,162,95,0.55)'; g.shadowBlur=30;
  g.strokeStyle='rgba(201,162,95,0.55)'; g.lineWidth=7;
  rr(M,M,FW,FH,24); g.stroke();
  g.shadowBlur=0;
  let met = g.createLinearGradient(0,M,0,H-M);
  met.addColorStop(0,GOLD_HI); met.addColorStop(.2,GOLD_DIM); met.addColorStop(.5,GOLD);
  met.addColorStop(.8,GOLD_DIM); met.addColorStop(1,GOLD_HI);
  g.strokeStyle=met; g.lineWidth=2.5;
  rr(M,M,FW,FH,24); g.stroke();
  g.restore();

  backCanvas = c;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  backData = ctx.getImageData(0,0,W,H).data;

  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
  return t;
}

function drawCoverFill(g, img, W, H){
  const iw = img.naturalWidth || img.width || 1;
  const ih = img.naturalHeight || img.height || 1;
  const s = Math.max(W/iw, H/ih);
  const w = iw*s, h = ih*s;
  g.drawImage(img, (W-w)/2, (H-h)/2, w, h);
}
function buildHoloFaceTexture(){
  return new Promise(resolve=>{
    const W=512, H=870;
    const bg = new Image(), subj = new Image();
    let loaded = 0;
    const tryBuild = ()=>{
      if (++loaded < 2) return;
      const c = document.createElement('canvas'); c.width=W; c.height=H;
      const g = c.getContext('2d');
      if (bg.complete && bg.naturalWidth) drawCoverFill(g, bg, W, H);
      else { g.fillStyle='#0a1030'; g.fillRect(0,0,W,H); }
      if (subj.complete && subj.naturalWidth) drawCoverFill(g, subj, W, H);
      const band = g.createLinearGradient(0,690,0,870);
      band.addColorStop(0,'rgba(0,0,0,0)'); band.addColorStop(1,'rgba(0,0,0,0.72)');
      g.fillStyle=band; g.fillRect(0,690,W,180);
      g.textAlign='center'; g.textBaseline='alphabetic';
      g.fillStyle='#ffd88a'; g.shadowColor='rgba(255,200,110,.6)'; g.shadowBlur=9;
      g.font='700 24px Cinzel, serif'; g.fillText('Freedom', W/2, 780);
      g.fillStyle='#f6d190'; g.shadowBlur=15; g.font='700 50px "Songti SC","STSong",serif';
      g.fillText('自由', W/2, 846); g.shadowBlur=0;
      const t = new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
      t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
      resolve(t);
    };
    bg.onload = tryBuild; bg.onerror = tryBuild;
    subj.onload = tryBuild; subj.onerror = tryBuild;
    bg.src = __CONFIG__.backgroundUrl;
    subj.src = __CONFIG__.subjectUrl;
  });
}

}

/* ============ 粒子分解/重组系统 ============ */
function sampleBackPixel(xNorm, yNorm){
  if (!backData) return [0.9,0.78,0.52];
  const px = Math.min(511, Math.max(0, Math.floor((xNorm+0.5)*512)));
  const py = Math.min(869, Math.max(0, Math.floor((0.5-yNorm)*870)));
  const idx = (py*512 + px)*4;
  return [backData[idx]/255, backData[idx+1]/255, backData[idx+2]/255];
}
function buildDissolveGeometry(N){
  const pos = new Float32Array(N*3);
  const scatter = new Float32Array(N*3);
  const color = new Float32Array(N*3);
  const size = new Float32Array(N);
  const W = CARD_W3, H = CARD_H3;
  for (let i=0;i<N;i++){
    const x = (Math.random()-0.5)*W;
    const y = (Math.random()-0.5)*H;
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=(Math.random()-0.5)*0.02;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    const mag = 0.8 + Math.random()*1.5;
    scatter[i*3]   = Math.sin(phi)*Math.cos(theta)*mag;
    scatter[i*3+1] = Math.sin(phi)*Math.sin(theta)*mag;
    scatter[i*3+2] = Math.cos(phi)*mag*0.35;
    const c = sampleBackPixel(x/W, y/H);
    // 向金色提亮
    let r = c[0]*0.55 + 0.91*0.45;
    let gg = c[1]*0.55 + 0.75*0.45;
    let b = c[2]*0.55 + 0.50*0.45;
    r*=1.4; gg*=1.4; b*=1.4;
    color[i*3]=Math.min(r,1); color[i*3+1]=Math.min(gg,1); color[i*3+2]=Math.min(b,1);
    size[i] = 0.5 + Math.random()*0.9;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aScatter', new THREE.BufferAttribute(scatter, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  return geo;
}
const VSHADER = `
  attribute vec3 aScatter;
  attribute vec3 aColor;
  attribute float aSize;
  uniform vec3 uSource;
  uniform float uSourceScale;
  uniform vec3 uTarget;
  uniform float uTargetScale;
  uniform float uProgress;
  uniform float uSize;
  varying vec3 vColor;
  varying float vAlpha;
  float easeOut(float t){ return 1.0 - pow(1.0 - t, 3.0); }
  void main(){
    float p = uProgress;
    float dT = clamp(p * 2.0, 0.0, 1.0);
    float rT = clamp((p - 0.5) * 2.0, 0.0, 1.0);
    vec3 pos;
    if (p < 0.5){
      vec3 onCard = uSource + position * uSourceScale;
      pos = onCard + aScatter * easeOut(dT);
      vAlpha = 1.0 - dT;
    } else {
      vec3 onCard = uTarget + position * uTargetScale;
      pos = onCard + aScatter * (1.0 - easeOut(rT));
      vAlpha = rT;
    }
    vColor = aColor;
    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = uSize * aSize * (40.0 / -mv.z);
  }
`;
const FSHADER = `
  varying vec3 vColor;
  varying float vAlpha;
  void main(){
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    float mask = smoothstep(0.5, 0.14, d);
    if (mask <= 0.0) discard;
    gl_FragColor = vec4(vColor, vAlpha * mask);
  }
`;
const fx = [];
for (let k=0;k<3;k++){
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      uSource:{value:new THREE.Vector3()},
      uSourceScale:{value:1},
      uTarget:{value:new THREE.Vector3()},
      uTargetScale:{value:1},
      uProgress:{value:0},
      uSize:{value:1.5}
    },
    vertexShader:VSHADER, fragmentShader:FSHADER,
    transparent:true, depthWrite:false, depthTest:true, blending:THREE.AdditiveBlending
  });
  const points = new THREE.Points(buildDissolveGeometry(1300), mat);
  points.frustumCulled = false;
  points.visible = false;
  scene.add(points);
  fx.push({ points, mat, active:false, start:0, card:null });
}
function triggerDissolve(card, slotIdx){
  const slotWorld = new THREE.Vector3(SLOT_XS[slotIdx], SLOT_Y, SLOT_Z);
  const src = card.outer.position;
  const f = fx.find(x=>!x.active) || fx[0];
  f.active = true; f.start = performance.now(); f.card = card;
  f.mat.uniforms.uSource.value.copy(src);
  f.mat.uniforms.uSourceScale.value = card.outer.scale.x;
  f.mat.uniforms.uTarget.value.copy(slotWorld);
  f.mat.uniforms.uTargetScale.value = SLOT_SCALE;
  f.mat.uniforms.uProgress.value = 0;
  f.points.visible = true;
  card.outer.visible = false;   // 粒子接管，隐藏实体牌
}
function updateFx(){
  for (const f of fx){
    if (!f.active) continue;
    const t = (performance.now()-f.start)/DISSOLVE_MS;
    if (t >= 1){
      f.active = false; f.points.visible = false;
      if (f.card){ f.card.outer.visible = true; f.card.arrived = true; f.card = null; }
    } else {
      f.mat.uniforms.uProgress.value = t;
    }
  }
}

/* ============ 加载牌面图片 ============ */
/* 78 张牌面合成 5 张 atlas，加载请求 78 -> 5 */
const ATLAS_CELL_W = 512, ATLAS_CELL_H = 870;
const ATLAS_GROUPS = {
  major: { src: 'assets/atlas_major.webp', cols: 6, rows: 4 },
  wands: { src: 'assets/atlas_wands.webp', cols: 4, rows: 4 },
  cups:  { src: 'assets/atlas_cups.webp',  cols: 4, rows: 4 },
  swords:{ src: 'assets/atlas_swords.webp', cols: 4, rows: 4 },
  pents: { src: 'assets/atlas_pents.webp',  cols: 4, rows: 4 }
};
function atlasCell(file){
  const m = /^(major|wands|cups|swords|pents)_(\d+)$/.exec(file);
  if (!m) return null;
  const group = m[1], n = parseInt(m[2], 10);
  const idx = group === 'major' ? n : n - 1;
  const g = ATLAS_GROUPS[group];
  return { group, src: g.src, col: idx % g.cols, row: Math.floor(idx / g.cols) };
}
function loadImageTexture(url){
  return new Promise((res)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      const tex = new THREE.Texture(img);
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      res(tex);
    };
    img.onerror = ()=> res(null);
    img.src = url;
  });
}
function loadAtlasImage(src){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=> res(img);
    img.onerror = ()=> rej(new Error('atlas load failed: ' + src));
    img.src = src;
  });
}
async function loadFrontTextures(){
  // 逐组加载 atlas，切出牌面后立即释放大图，控制峰值内存；失败回退单张 CDN
  for (const group of Object.keys(ATLAS_GROUPS)){
    let img = null;
    try { img = await loadAtlasImage(ATLAS_GROUPS[group].src); } catch(e){ img = null; }
    for (let i=0;i<deck.length;i++){
      const d = deck[i];
      if (d.isHolo) continue;
      const cell = atlasCell(d.file);
      if (!cell || cell.group !== group) continue;
      if (img){
        try {
          cards[i].mFront.map = composeFront(i, img, cell.col*ATLAS_CELL_W, cell.row*ATLAS_CELL_H, ATLAS_CELL_W, ATLAS_CELL_H);
          cards[i].mFront.needsUpdate = true;
        } catch(e){ /* 保留兜底名称牌面 */ }
      } else {
        loadImageTexture(IMG_BASE + d.file + '.webp').then(tex=>{
          if (tex){ cards[i].mFront.map = composeFront(i, tex.image); cards[i].mFront.needsUpdate = true; }
        });
      }
    }
    img = null;   // 释放 atlas 引用
  }
}

const ui = {
  running:false, handPresent:false,
  gesture:'none',
  selectIndex:CENTER_INDEX,
  pickedCount:0, revealed:false, revealAt:0, lastPick:0,

};

/* ============ 音频 ============ */
let audioCtx = null;
function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(freq, dur, type='sine', gain=0.14, when=0){
  const ctx = ensureAudio(); const t0 = ctx.currentTime + when;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function sfxPick(){ tone(440,.14,'triangle',.14); tone(660,.1,'sine',.09,.03); }
function sfxReveal(){ tone(392,.3,'sine',.12); tone(494,.3,'sine',.1,.08); tone(587,.4,'sine',.1,.16); }
function sfxReset(){ tone(300,.25,'sine',.1); tone(200,.3,'sine',.08,.06); }

/* ============ MediaPipe ============ */
let hands = null, processing = false, loaded = false;
function initHands(){
  hands = new Hands({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.6 });
  hands.onResults(onResults);
}

function distPts(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function palmX(lm){ const px=(lm[0].x+lm[5].x+lm[9].x+lm[13].x+lm[17].x)/5; return (1-px)*innerWidth; }
function handScale(lm){ return Math.max(distPts(lm[0], lm[9]), 0.02); }

function onResults(results){
  if (!loaded){ loaded = true; loadingEl.classList.remove('show'); }
  const handsArr = results.multiHandLandmarks || [];
  if (!handsArr.length){ ui.handPresent = false; ui.gesture = 'none'; ui.fistStart = null; ui.fistArmed = true; return; }
  if (touchActive){ ui.gesture = 'none'; ui.fistStart = null; return; }   // 触摸中，让触摸接管
  ui.handPresent = true;

  let openX = null, fistHand = false;
  for (const lm of handsArr){
    let minX=1,maxX=0; for (const p of lm){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; }
    if ((maxX-minX) < FAR_WIDTH) continue;
    const ext = [
      distPts(lm[8],lm[0]) > distPts(lm[6],lm[0])*1.05,
      distPts(lm[12],lm[0]) > distPts(lm[10],lm[0])*1.05,
      distPts(lm[16],lm[0]) > distPts(lm[14],lm[0])*1.05,
      distPts(lm[20],lm[0]) > distPts(lm[18],lm[0])*1.05
    ];
    const oc = ext[0]+ext[1]+ext[2]+ext[3];
    if (oc === 0){ fistHand = true; }
    else if (oc >= 3){ if(openX==null) openX = palmX(lm); }
  }

  if (fistHand){
    ui.gesture = 'pick';
    const now = performance.now();
    if (ui.fistArmed){
      if (ui.fistStart == null) ui.fistStart = now;
      if (now - ui.fistStart >= PICK_HOLD_MS){
        ui.fistStart = null;
        ui.fistArmed = false;      // 选完后需先松手，避免一次握拳连选
        tryPick();
      }
    }
    return;
  }

  ui.fistStart = null;
  ui.fistArmed = true;

  if (openX != null){
    ui.gesture = 'shuffle';
    const dx = openX - innerWidth/2;
    let eff = 0;
    if (dx >  SHUFFLE_DEADZONE) eff = dx - SHUFFLE_DEADZONE;
    else if (dx < -SHUFFLE_DEADZONE) eff = dx + SHUFFLE_DEADZONE;
    const norm = clamp(eff / (innerWidth/2 - SHUFFLE_DEADZONE), -1, 1);
    const target = CENTER_INDEX + norm * (MAX_INDEX - CENTER_INDEX);
    ui.selectIndex += (target - ui.selectIndex) * SHUFFLE_SMOOTH;
  } else {
    ui.gesture = 'none';
  }
}

function currentCard(){ return clamp(Math.round(ui.selectIndex), 0, MAX_INDEX); }

function pickTarget(){
  const c = Math.round(ui.selectIndex);
  let best=-1, bestD=Infinity;
  for (let i=0;i<cards.length;i++){
    if (cards[i].slotIndex >= 0 || cards[i].hidden) continue;
    const d = Math.abs(i - c);
    if (d < bestD){ bestD=d; best=i; }
  }
  return best;
}

function tryPick(){
  const now = performance.now();
  if (now - ui.lastPick < PICK_COOLDOWN_MS) return;
  if (ui.pickedCount >= 3 || ui.revealed) return;
  let t = pickTarget();
  // 测试版：首张必出隐藏卡
  if (HOLO_FORCE && ui.pickedCount === 0 && holoIndex >= 0 && cards[holoIndex].slotIndex < 0){ t = holoIndex; }
  if (t < 0) return;
  cards[t].slotIndex = ui.pickedCount;
  cards[t].arrived = false;
  const tHolo = deck[t] && deck[t].isHolo;
  cards[t].reversed = tHolo ? false : Math.random() < 0.5;   // 隐藏卡恒为正位
  cards[t].front.rotation.z = cards[t].reversed ? Math.PI : 0;
  ui.pickedCount++;
  ui.lastPick = now;
  sfxPick();
  triggerDissolve(cards[t], cards[t].slotIndex);
  if (ui.pickedCount === 3) ui.revealAt = now + REVEAL_DELAY_MS;
}

function reveal(){
  if (ui.revealed) return;
  ui.revealed = true;
  for (const c of cards){ if (c.slotIndex >= 0){ c.targetRotY = Math.PI; } }
  sfxReveal();
  ui.readingAt = performance.now() + 1600;   // 翻牌动画结束后自动解牌
}

/* —— 三张牌阵解读（过去 · 现在 · 未来） —— */
const READING_POS = [
  { zh:'过去', en:'Past' },
  { zh:'现在', en:'Present' },
  { zh:'未来', en:'Future' }
];
function pickedCards(){
  const list = [];
  for (let k=0;k<3;k++){
    const c = cards.find(x => x.slotIndex === k);
    if (!c) continue;
    const idx = cards.indexOf(c);
    const d = deck[idx];
    list.push({ idx:idx, isHolo: !!d.isHolo, zh:d.zh, en:d.en, meaning:d.meaning, pos:READING_POS[k].zh, posEn:READING_POS[k].en,
      reversed: !!c.reversed, orient: c.reversed ? '逆位' : '正位' });
  }
  return list;
}

function buildReadingRows(){
  return pickedCards().map(c =>
    '<div class="r-card" data-idx="' + c.idx + '" role="button" tabindex="0">' +
      '<div class="r-pos">' + c.pos + ' · ' + c.posEn +
        '<span class="r-orient' + (c.reversed ? ' rev' : '') + '">' + c.orient + '</span>' +
        (c.isHolo ? '<span class="r-orient holo">全息</span>' : '') + '</div>' +

}

function localSummary(){

    + '它们彼此呼应，提示你顺应这股能量的流动，稳步前行。' + revNote;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function askLLM(question, picked){
  const res = await fetch(LLM_API_URL, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + LLM_API_KEY
    },
    body: JSON.stringify({
      model: LLM_MODEL,
      messages: [
        { role:'system', content:'你是一位客观公正、一针见血、温柔但有洞察力的塔罗解读师。' },
        { role:'user',   content: buildPrompt(question, picked) }
      ],
      temperature: 0.9,
      stream: false
    })
  });
  if (!res.ok){
    let msg = 'HTTP ' + res.status;
    try{ const j = await res.json(); if (j && j.error && j.error.message) msg += ': ' + j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!content) throw new Error('empty response');
  return content;
}

function rebuildFronts(){
  for (let i=0;i<cards.length;i++){
    const inDeck = i < deck.length;
    cards[i].hidden = !inDeck;
    cards[i].outer.visible = inDeck;
    if (!inDeck){ cards[i].mFront.map = null; cards[i].mFront.needsUpdate = true; continue; }
    cards[i].mFront.map = (deck[i].isHolo ? makeHoloFront() : makeFallbackFront(i));
    cards[i].mFront.needsUpdate = true;
  }
  loadFrontTextures();
}
function resetAll(){
  buildDeck();                         // 重新洗牌（可能含隐藏卡）
  rebuildFronts();                     // 按新顺序重建正面牌面并设置显隐
  for (const c of cards){ if (!c.hidden){ c.slotIndex=-1; c.targetRotY=0; c.outer.visible=true; c.arrived=false; c.reversed=false; c.front.rotation.z=0; } }
  for (const f of fx){ f.active=false; f.points.visible=false; f.card=null; }
  ui.pickedCount=0; ui.revealed=false; ui.revealAt=0; ui.lastPick=0;
  ui.readingAt=0; ui.readingShown=false;

  closeViewer();
  ui.selectIndex = CENTER_INDEX;

/* ============ 布局 + 渲染 ============ */
function layoutCards(){
  const s = ui.selectIndex;
  for (let i=0;i<cards.length;i++){
    const c = cards[i];
    if (c.slotIndex >= 0 || c.hidden) continue;
    const rel = i - s;
    // 沿一段圆弧展开：两侧向后收、轻微下沉、朝内旋转（略环形）
    const th = clamp(rel * FAN_STEP, -1.5, 1.5);
    const tx = FAN_R * Math.sin(th);
    const ty = -FAN_DROOP * (1 - Math.cos(th));
    const tz = FAN_R * (Math.cos(th) - 1) + (Math.abs(rel)<0.5 ? 0.2 : 0);
    const tr = clamp(-th * FAN_TURN, -1.1, 1.1);
    const top = clamp(1 - Math.abs(rel)*0.13, 0.16, 1);
    const tsc = Math.abs(rel)<0.5 ? 1.12 : clamp(1 - Math.abs(rel)*0.04, 0.82, 1);
    const k = 0.16;
    c.outer.position.x += (tx - c.outer.position.x)*k;
    c.outer.position.y += (ty - c.outer.position.y)*k;
    c.outer.position.z += (tz - c.outer.position.z)*k;
    c.outer.rotation.y += (tr - c.outer.rotation.y)*k;
    const ns = c.outer.scale.x + (tsc - c.outer.scale.x)*k;
    c.outer.scale.set(ns, ns, ns);
    c.mBack.opacity  += (top - c.mBack.opacity)*k;
    c.mFront.opacity += (top - c.mFront.opacity)*k;
  }
}
function layoutSlots(){
  for (const c of cards){
    if (c.slotIndex < 0) continue;
    const sx = SLOT_XS[c.slotIndex];
    const k = 0.14;
    c.outer.position.x += (sx - c.outer.position.x)*k;
    c.outer.position.y += (SLOT_Y - c.outer.position.y)*k;
    c.outer.position.z += (SLOT_Z - c.outer.position.z)*k;
    c.outer.rotation.y += (0 - c.outer.rotation.y)*k;
    const ns = c.outer.scale.x + (SLOT_SCALE - c.outer.scale.x)*k;
    c.outer.scale.set(ns, ns, ns);
    c.mBack.opacity  += (1 - c.mBack.opacity)*k;
    c.mFront.opacity += (1 - c.mFront.opacity)*k;
  }
}
function animateFlips(){
  for (const c of cards){
    if (c.rotY !== c.targetRotY){
      c.rotY += (c.targetRotY - c.rotY)*0.14;
      if (Math.abs(c.targetRotY - c.rotY) < 0.02) c.rotY = c.targetRotY;
      c.flipGroup.rotation.y = c.rotY;
    }
  }
}
function updateHalo(){
  const t = pickTarget();
  const show = ui.running && !ui.revealed && ui.pickedCount < 3 && t >= 0;
  haloGroup.visible = show;
  if (!show) return;
  const c = cards[t];
  const k = 0.22;                       // 平滑跟随当前目标牌
  haloGroup.position.x += (c.outer.position.x - haloGroup.position.x)*k;
  haloGroup.position.y += (c.outer.position.y - haloGroup.position.y)*k;
  haloGroup.position.z += (c.outer.position.z - haloGroup.position.z)*k;
  haloGroup.rotation.y += (c.outer.rotation.y - haloGroup.rotation.y)*k;
  const s = c.outer.scale.x + (c.outer.scale.x - haloGroup.scale.x)*k;
  haloGroup.scale.set(s, s, s);

  // 握拳确认进度：光圈收缩 + 变亮，握满即选牌
  const hold = ui.fistStart ? clamp((performance.now()-ui.fistStart)/PICK_HOLD_MS, 0, 1) : 0;
  const pulse = 1 + 0.03*Math.sin(performance.now()*0.005);
  const ringScale = 1.08*pulse*(1-hold) + 1.0*hold;
  ringMesh.scale.set(ringScale, ringScale, 1);
  ringMat.opacity = 0.55 + 0.45*hold;
  glowMat.opacity = 0.40 + 0.50*hold;
}

/* ============ 光线检测 ============ */
const lightCanvas = document.createElement('canvas');
const lightCtx = lightCanvas.getContext('2d', { willReadFrequently:true });
let lastLight = 0;
function checkLight(){
  if (!video.videoWidth) return;
  if (lightCanvas.width !== 32){ lightCanvas.width = 32; lightCanvas.height = 24; }
  lightCtx.drawImage(video, 0, 0, 32, 24);
  const d = lightCtx.getImageData(0,0,32,24).data;
  let sum = 0;
  for (let i=0;i<d.length;i+=4) sum += d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
  const avg = sum / (d.length/4);
  ui.lightWarn = avg < 30;
}

/* ============ 状态与调试 ============ */
function updateStatus(){
  let msg, cls='';
  if (!ui.running) msg = '点击“开启占卜”授权摄像头';

  else if (ui.pickedCount >= 3) msg = '🃏 三张已选，即将开牌…';
  else if (ui.gesture === 'pick') msg = '✊ 握拳选牌（保持片刻确认）—— 已选 ' + ui.pickedCount + ' / 3';
  else if (ui.gesture === 'shuffle') msg = '🖐 洗牌中 —— 已选 ' + ui.pickedCount + ' / 3';
  else msg = '🖐 张开手掌洗牌 ｜ ✊ 握拳选牌';
  if (msg !== ui.lastStatus){
    ui.lastStatus = msg;
    statusEl.textContent = msg;
    statusEl.className = cls;
  }
}
function updateDebug(){

    'gesture: ' + ui.gesture + '\n' +

}

/* ============ 主循环 ============ */
let lastFrame = performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  drawStars(now);
  layoutCards();
  layoutSlots();
  animateFlips();
  updateHalo();
  updateFx();
  for (let k=0;k<3;k++){
    const c = cards.find(x => x.slotIndex === k);
    slotFrames[k].visible = !(c && c.arrived);
  }
  if (ui.revealAt && !ui.revealed && now >= ui.revealAt) reveal();
  if (ui.readingAt && !ui.readingShown && now >= ui.readingAt){ showReading(); ui.readingShown = true; }
  renderer.render(scene, camera);

  if (ui.running && video.readyState >= 2 && !processing){
    processing = true;
    hands.send({ image: video }).catch(()=>{}).then(()=>{ processing = false; });
  }
  if (ui.running && now - lastLight > 500){ checkLight(); lastLight = now; }
  updateStatus();
  lastFrame = now;
}
loop();

/* ============ 相机 ============ */
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream; await video.play();
    ui.running = true;
    overlay.style.display = 'none';
  }catch(e){
    loadingEl.classList.remove('show');
    errEl.textContent = '⚠ 摄像头未授权：' + e.message + '（请在浏览器地址栏允许摄像头权限，并使用 localhost 或 https 访问）';
  }
}

/* ============ 卡牌放大观看 ============ */
const viewerEl = document.getElementById('viewer');
const vStage = document.getElementById('vStage');
const vInfo = document.getElementById('vInfo');
let holoInstance = null;
function disposeHolo(){ if (holoInstance){ try{ holoInstance.dispose(); }catch(e){} holoInstance = null; } }

/* —— 统一动态倾斜：指针 / 陀螺仪 / 拖拽 —— */
const viewerTilt = (function(){
  let cur={x:0,y:0}, tgt={x:0,y:0}, dragging=false, drag={x0:0,y0:0,tx:0,ty:0}, justDragged=0, raf=0, sub=null;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const setTarget=(x,y)=>{ tgt.x=clamp(x,-1.25,1.25); tgt.y=clamp(y,-1.25,1.25); if(!raf) raf=requestAnimationFrame(step); };
  function step(){
    cur.x += (tgt.x-cur.x)*0.14; cur.y += (tgt.y-cur.y)*0.14;
    if(sub) sub(cur.x, cur.y);
    if(Math.abs(tgt.x-cur.x)>0.0006 || Math.abs(tgt.y-cur.y)>0.0006) raf=requestAnimationFrame(step); else raf=0;
  }
  return {
    subscribe(fn){ sub=fn; },
    clear(){ sub=null; },
    setPointer(cx,cy){ if(dragging || Date.now()-justDragged < 260) return; setTarget(cx/innerWidth*2-1, cy/innerHeight*2-1); },
    setGyro(gamma,beta){ if(dragging || Date.now()-justDragged < 260) return; setTarget(gamma/38, (beta-90)/42); },
    startDrag(cx,cy){ dragging=true; justDragged=0; drag={x0:cx,y0:cy,tx:cur.x,ty:cur.y}; },
    moveDrag(cx,cy){ if(!dragging) return; setTarget(drag.tx+(cx-drag.x0)/90, drag.ty+(cy-drag.y0)/90); },
    endDrag(){ dragging=false; justDragged=Date.now(); },
    reset(){ dragging=false; setTarget(0,0); }
  };
})();
const coarsePointer = matchMedia('(pointer: coarse)').matches;

function openCardWithDesc(desc, imageSrc){
  disposeHolo();
  vStage.innerHTML = '';
  viewerTilt.clear();
  if (desc.isHolo){
    vInfo.innerHTML =
      '<div class="v-name">' + desc.zh + '<span>' + desc.en + '</span></div>' +
      '<div class="v-meaning">' + (desc.meaning || '') + '</div>' +
      '<div class="v-tip">🖐 滑动 / 拖拽旋转 · ' + (coarsePointer ? '倾斜手机' : '移动鼠标') + '，欣赏全息光泽</div>';
    const holder = document.createElement('div');
    holder.className = 'holo-holder';
    vStage.appendChild(holder);
    try { holoInstance = mountHoloCard(holder); }
    catch(e){ vStage.innerHTML = '<div class="v-fallback">✦</div>'; vInfo.innerHTML += '<div class="v-meaning">全息渲染暂不可用（需 WebGL2）</div>'; }
    viewerTilt.subscribe((x,y)=>{ if(holoInstance) holoInstance.setPointer(50 + x*50, 50 + y*50); });
  } else {
    vInfo.innerHTML =
      '<div class="v-name">' + desc.zh + '<span>' + desc.en + '</span></div>' +
      '<div class="v-meaning">' + (desc.meaning || '') + '</div>';
    if (imageSrc){
      const wrap = document.createElement('div');
      wrap.className = 'tilt3d';
      const img = document.createElement('img');
      img.className = 'v-cardimg';
      img.draggable = false;
      img.src = imageSrc;
      img.alt = desc.zh;
      img.onerror = function(){ vStage.innerHTML = '<div class="v-fallback">' + desc.zh + '</div>'; };
      const glare = document.createElement('div');
      glare.className = 'v-glare';
      wrap.appendChild(img); wrap.appendChild(glare);
      vStage.appendChild(wrap);
      viewerTilt.subscribe((x,y)=>{
        wrap.style.setProperty('--rx', (-y*18)+'deg');
        wrap.style.setProperty('--ry', (x*18)+'deg');
        wrap.style.setProperty('--gp', (50+x*42)+'% '+(50+y*42)+'%');
      });
    } else {
      vStage.innerHTML = '<div class="v-fallback">' + desc.zh + '</div>';
    }
  }
  viewerEl.classList.add('show');
  viewerTilt.reset();
}
function openCardViewer(idx){
  const d = deck[idx];
  if (!d) return;
  let src = null;
  if (!d.isHolo){
    const front = cards[idx].mFront.map;
    if (front && front.image && front.image.toDataURL) src = front.image.toDataURL('image/png');
  }
  openCardWithDesc({ zh:d.zh, en:d.en, meaning:d.meaning, isHolo: !!d.isHolo }, src);
}
function openHistoryCard(cardInfo){
  const desc = { zh:cardInfo.zh, en:cardInfo.en, meaning:cardInfo.meaning || '', isHolo: !!cardInfo.isHolo };
  const src = cardInfo.isHolo ? null : (IMG_BASE + cardInfo.file + '.webp');
  if (historyEl) historyEl.classList.remove('show');
  openCardWithDesc(desc, src);
}
function closeViewer(){
  disposeHolo();
  viewerEl.classList.remove('show');
  viewerTilt.clear();
  vStage.innerHTML = '';
}
document.getElementById('vClose').addEventListener('click', closeViewer);
viewerEl.querySelector('.v-backdrop').addEventListener('click', closeViewer);

/* 指针悬停倾斜（桌面） */
viewerEl.addEventListener('pointermove', e=>{ viewerTilt.setPointer(e.clientX, e.clientY); });
/* 拖拽旋转（桌面鼠标 + 触摸） */
vStage.addEventListener('pointerdown', e=>{ if(e.cancelable) e.preventDefault(); viewerTilt.startDrag(e.clientX, e.clientY); try{ vStage.setPointerCapture(e.pointerId); }catch(_){} });
vStage.addEventListener('pointermove', e=>{ viewerTilt.moveDrag(e.clientX, e.clientY); });
vStage.addEventListener('pointerup', ()=> viewerTilt.endDrag());
vStage.addEventListener('pointercancel', ()=> viewerTilt.endDrag());
/* 陀螺仪（手机旋转感应；iOS 需授权） */
window.addEventListener('deviceorientation', e=>{
  if(!viewerEl.classList.contains('show') || !coarsePointer) return;
  if(e.gamma==null || e.beta==null) return;
  viewerTilt.setGyro(e.gamma, e.beta);
});
document.addEventListener('pointerdown', function(){
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(s=>{ if(s!=='granted') console.warn('[gyro]', s); }).catch(()=>{});
  }
}, { once:true });



/* ============ 历史记录（本地保存最近 3 次） ============ */
const HISTORY_KEY = 'kiro_tarot_history_v1';
function loadHistory(){ try{ const a = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveReadingResult(record){
  const list = loadHistory();
  list.unshift(record);
  while (list.length > 3) list.pop();
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){}
}
function renderHistory(){
  const list = loadHistory();
  const el = document.getElementById('hList');
  if (!list.length){ el.innerHTML = '<div class="h-empty">还没有占卜记录，去抽一次牌吧 ✨</div>'; return; }
  el.innerHTML = list.map(r=>{
    const d = new Date(r.time || Date.now());
    const when = (d.getMonth()+1)+'/'+d.getDate()+' ' + String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const chips = (r.cards||[]).map(c=>
      '<button class="h-chip'+(c.reversed?' rev':'')+(c.isHolo?' holo':'')+'"' +
      ' data-zh="'+escapeHtml(c.zh)+'" data-en="'+escapeHtml(c.en||'')+'" data-meaning="'+escapeHtml(c.meaning||'')+'"' +
      ' data-file="'+escapeHtml(c.file||'')+'" data-holo="'+(c.isHolo?'1':'0')+'">' +
      escapeHtml(c.zh)+' · '+(c.reversed?'逆':'正')+' 🔍</button>'
    ).join('');
    return '<div class="h-item">'+
      '<div class="h-time">'+when+'</div>'+
      (r.question ? '<div class="h-q">问：「'+escapeHtml(r.question)+'」</div>' : '')+
      '<div class="h-cards">'+chips+'</div>'+
      (r.summary ? '<div class="h-summary">'+escapeHtml(r.summary).replace(/\n/g,'<br>')+'</div>' : '')+
      '</div>';
  }).join('');
}
const btnHistory = document.getElementById('btnHistory');
const historyEl = document.getElementById('history');
btnHistory.addEventListener('click', ()=>{ renderHistory(); historyEl.classList.add('show'); });
document.getElementById('hClose').addEventListener('click', ()=> historyEl.classList.remove('show'));
historyEl.querySelector('.h-backdrop').addEventListener('click', ()=> historyEl.classList.remove('show'));
document.getElementById('hList').addEventListener('click', e=>{
  const chip = e.target.closest('.h-chip');
  if (!chip) return;
  openHistoryCard({ zh:chip.dataset.zh, en:chip.dataset.en, meaning:chip.dataset.meaning, isHolo: chip.dataset.holo==='1', file: chip.dataset.file });
});

/* ============ 全屏（手机沉浸） ============ */
const btnFull = document.getElementById('btnFull');
function fullscreenSupported(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen);
}
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen(){
  const el = document.documentElement;
  if (isFullscreen()){
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else if (el.requestFullscreen){
    el.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  } else if (el.webkitRequestFullscreen){
    el.webkitRequestFullscreen();
  } else {
    alert('此浏览器不支持直接全屏。\niPhone 请用 Safari「分享 → 添加到主屏幕」，打开即是全屏沉浸。');
  }
}
function updateFullBtn(){
  if (!btnFull) return;
  btnFull.textContent = isFullscreen() ? '⛶ 退出全屏' : '⛶ 全屏';
}
btnFull.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFullBtn);
document.addEventListener('webkitfullscreenchange', updateFullBtn);
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitScene();
  drawNebula();
  initStars();
});

/* ============ 触摸操作：滑动洗牌 + 点按选牌（与手势并存，触摸期间手势让位） ============ */
let touchActive = false, touchStartX = 0, touchStartY = 0, touchMoved = false, touchSelect0 = CENTER_INDEX;
function touchIgnored(t){
  return !!(t && t.closest && t.closest('button,#reading,#overlay'));
}
document.addEventListener('touchstart', (e)=>{
  if (!ui.running || ui.revealed || ui.pickedCount >= 3) return;
  if (touchIgnored(e.target)) return;
  const t = e.touches[0];
  touchActive = true; touchMoved = false;
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchSelect0 = ui.selectIndex;
}, { passive:true });
document.addEventListener('touchmove', (e)=>{
  if (!touchActive) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (!touchMoved && Math.hypot(dx,dy) > 10) touchMoved = true;
  if (touchMoved){
    const norm = clamp(dx / (innerWidth*0.5), -1, 1);
    ui.selectIndex = touchSelect0 - norm * (MAX_INDEX - CENTER_INDEX);
  }
}, { passive:true });
document.addEventListener('touchend', (e)=>{
  if (!touchActive) return;
  touchActive = false;
  if (!touchMoved) tryPick();          // 轻点 = 选中间那张牌
}, { passive:true });
</script>
